<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#333333">
  <title>Amjad Sultan | Architect & Graphic Designer</title>
  <meta name="description" content="Amjad Sultan — Architect & Graphic Designer. Architecture, 3D visualization and graphic design.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --green:#568259;
      --bg:#333333;
      --text:#cccccc;
      --white:#f5f5f5;
      --card:#3a3a3a;
      --card-hover:#414141;
      --line:rgba(204,204,204,.14);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(86,130,89,.24), transparent 34%),
        var(--bg);
      color:var(--text);
      font-family:"Tajawal",Arial,sans-serif;
    }

    a{color:inherit}
    .page{width:min(620px,100%);margin:auto;padding:0 18px 36px}

    .hero{
      position:relative;
      height:230px;
      margin:0 -18px;
      overflow:hidden;
      border-radius:0 0 28px 28px;
      background:#222;
    }
    .hero img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
    }
    .hero:after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(to bottom, rgba(0,0,0,.03) 20%, rgba(51,51,51,.62) 100%);
      pointer-events:none;
    }

    .profile{
      position:relative;
      z-index:2;
      width:112px;
      height:112px;
      margin:-56px auto 14px;
      border-radius:50%;
      padding:4px;
      background:var(--bg);
      box-shadow:0 10px 30px rgba(0,0,0,.3);
    }
    .profile img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
      display:block;
    }

    .intro{text-align:center}
    h1{
      margin:0;
      color:var(--white);
      font-size:30px;
      line-height:1.1;
      font-weight:800;
      letter-spacing:-.4px;
    }
    .role{
      margin:8px 0 5px;
      color:var(--text);
      font-size:15px;
      font-weight:500;
    }
    .location{
      color:rgba(204,204,204,.7);
      font-size:12px;
      margin-bottom:25px;
    }

    .links{display:grid;gap:11px}
    .link{
      position:relative;
      display:flex;
      align-items:center;
      min-height:58px;
      padding:12px 18px;
      border:1px solid var(--line);
      border-radius:15px;
      background:rgba(58,58,58,.82);
      text-decoration:none;
      transition:transform .2s ease, background .2s ease, border-color .2s ease;
      overflow:hidden;
    }
    .link:hover{
      transform:translateY(-2px);
      background:var(--card-hover);
      border-color:rgba(86,130,89,.7);
    }
    .link.primary{
      background:var(--green);
      color:#fff;
      border-color:var(--green);
      font-weight:700;
    }
    .link.primary:hover{background:#628f66}
    .link-icon{
      width:34px;height:34px;flex:0 0 34px;
      display:grid;place-items:center;
      border-radius:10px;
      background:rgba(255,255,255,.08);
      font-size:13px;font-weight:800;
    }
    .primary .link-icon{background:rgba(0,0,0,.12)}
    .link-label{
      flex:1;
      text-align:center;
      padding-right:34px;
      font-size:15px;
    }
    .arrow{
      position:absolute;
      right:16px;
      font-size:17px;
      opacity:.6;
    }

    .contact-title{
      text-align:center;
      margin:24px 0 10px;
      color:rgba(204,204,204,.72);
      font-size:13px;
      font-weight:600;
      letter-spacing:.3px;
      text-transform:uppercase;
    }

    .socials{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
      margin:0;
    }
    .social{
      width:45px;height:45px;
      display:grid;place-items:center;
      border:1px solid var(--line);
      border-radius:50%;
      background:rgba(58,58,58,.7);
      text-decoration:none;
      font-size:12px;
      font-weight:800;
      transition:.2s ease;
    }
    .social:hover{
      transform:translateY(-2px);
      border-color:var(--green);
      background:rgba(86,130,89,.15);
      color:#fff;
    }

    footer{
      text-align:center;
      margin-top:25px;
      color:rgba(204,204,204,.48);
      font-size:11px;
    }

    @media (max-width:520px){
      .hero{height:185px}
      .profile{width:100px;height:100px;margin-top:-50px}
      h1{font-size:27px}
      .page{padding-left:15px;padding-right:15px}
      .hero{margin-left:-15px;margin-right:-15px}
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="hero">
      <img src="cover.jpg" alt="Amjad Sultan cover">
    </header>

    <div class="profile">
      <img src="profile.jpg" alt="Amjad Sultan">
    </div>

    <section class="intro">
      <h1>Amjad Sultan</h1>
      <div class="role">Architect &amp; Graphic Designer</div>
      <div class="location">Architecture • 3D • Graphic Design</div>
    </section>

    <section class="links" aria-label="Main links">

      <a class="link primary"
         href="https://www.behance.net/amjadsultan2002"
         target="_blank" rel="noopener">
        <span class="link-icon">Be</span>
        <span class="link-label">My Portfolio</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="Amjad_Sultan_CV.pdf"
         target="_blank" rel="noopener">
        <span class="link-icon">CV</span>
        <span class="link-label">View / Download CV</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="https://www.instagram.com/amjadsultan2002/"
         target="_blank" rel="noopener">
        <span class="link-icon">IG</span>
        <span class="link-label">Instagram</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="https://www.linkedin.com/in/amjad-sultan-354664357/"
         target="_blank" rel="noopener">
        <span class="link-icon">in</span>
        <span class="link-label">LinkedIn</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="https://www.pinterest.com/amjadsultan2002/"
         target="_blank" rel="noopener">
        <span class="link-icon">P</span>
        <span class="link-label">Pinterest</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="https://www.facebook.com/profile.php?id=100095302298852"
         target="_blank" rel="noopener">
        <span class="link-icon">f</span>
        <span class="link-label">Facebook</span>
        <span class="arrow">↗</span>
      </a>

    </section>

    <div class="contact-title">Contact Me</div>
    <nav class="socials" aria-label="Contact links">
      <a class="social" href="https://wa.me/963968364160" target="_blank" rel="noopener" aria-label="WhatsApp">WA</a>
      <a class="social" href="tel:+963968364160" aria-label="Phone">☎</a>
      <a class="social" href="mailto:amjadsultan2002@gmail.com" aria-label="Email">@</a>
    </nav>

    <footer>© 2026 Amjad Sultan</footer>
  </main>
</body>
</html>
